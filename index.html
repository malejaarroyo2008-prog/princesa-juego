<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Princesa: temporada sin scroll</title>
  <meta name="description" content="Juego personal para soltar el celular, con Princesa la gata.">
  <meta name="theme-color" content="#B84A33">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="iconos/icono-192.png" type="image/png">
  <link rel="apple-touch-icon" href="iconos/icono-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header class="cabecera">
      <span class="marca">Princesa</span>
      <div id="chips" class="chips"></div>
      <button id="btn-ajustes" class="icono" aria-label="Ajustes">⚙️</button>
    </header>
    <div id="banner-demo" class="banner-demo" hidden>
      <span>MODO DEMOSTRACIÓN · datos de ejemplo</span>
      <button id="salir-demo" class="btn pequeno">Salir</button>
    </div>
    <main id="vista"></main>
    <nav class="nav" aria-label="Secciones">
      <button data-vista="hoy"><span aria-hidden="true">📝</span>Hoy</button>
      <button data-vista="princesa"><span aria-hidden="true">🐱</span>Princesa</button>
      <button data-vista="retos"><span aria-hidden="true">⚔️</span>Retos</button>
      <button data-vista="tienda"><span aria-hidden="true">🛍️</span>Tienda</button>
      <button data-vista="progreso"><span aria-hidden="true">📊</span>Progreso</button>
    </nav>
  </div>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/princesa.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
